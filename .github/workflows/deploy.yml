name: CI/CD - Validate and Deploy Firebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Firebase environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type deploy-staging or deploy-production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  deploy-staging:
    name: Deploy Firebase Staging
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && inputs.confirmation == 'deploy-staging'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify staging secrets
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        run: |
          test -n "$FIREBASE_TOKEN"
          test -n "$FIREBASE_PROJECT"

      - name: Deploy Hosting and Firestore Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        run: firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN" --non-interactive

  deploy-production:
    name: Deploy Firebase Production
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.confirmation == 'deploy-production'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify production secrets
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: |
          test -n "$FIREBASE_TOKEN"
          test -n "$FIREBASE_PROJECT"

      - name: Deploy Hosting and Firestore Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN" --non-interactive
