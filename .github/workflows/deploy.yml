name: CI/CD — Build & Deploy Firebase

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: src
        run: |
          npm ci

      - name: Build
        working-directory: src
        run: |
          npm run build

      - name: Install firebase-tools
        run: |
          npm install -g firebase-tools

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/develop'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        run: |
          firebase deploy --only hosting,functions,firestore:rules,storage --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: |
          firebase deploy --only hosting,functions,firestore:rules,storage --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      - name: Post-deploy note
        run: echo "Deploy job finished for $GITHUB_REF"

# Notes:
# - Required GitHub secrets:
#   FIREBASE_TOKEN_STAGING, FIREBASE_PROJECT_ID_STAGING,
#   FIREBASE_TOKEN_PRODUCTION, FIREBASE_PROJECT_ID_PRODUCTION
# - Adjust `--only` targets to match your firebase.json configuration.
